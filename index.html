<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فلش‌کارت انگلیسی</title>
<meta name="theme-color" content="#6c4cf1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلش‌کارت">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="ic" href="">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1d1b2e;--mu:#6b6885;--pr:#6c4cf1;--pr2:#8f78ff;--ok:#16a34a;--bad:#e11d48;--bd:#e4e0f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#1e1b3a;--tx:#efeefc;--mu:#a09dc4;--bd:#34305c;--pr:#8f78ff;--pr2:#6c4cf1}}
:root[data-theme="dark"]{--bg:#14122a;--card:#1e1b3a;--tx:#efeefc;--mu:#a09dc4;--bd:#34305c;--pr:#8f78ff;--pr2:#6c4cf1}
html{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;min-height:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;background:var(--pr);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer}
.btn.sec{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.mu{color:var(--mu);font-size:13px}
.w{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.w:last-child{border:0}
.en{direction:ltr;text-align:left;font-weight:600}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.flip{perspective:900px;height:240px;margin-bottom:12px}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.f .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.face.b{transform:rotateY(180deg);background:var(--card);color:var(--tx);border:2px solid var(--pr)}
.big{font-size:30px;font-weight:800;direction:ltr}
.opt{display:block;width:100%;text-align:center;margin:8px 0;padding:12px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.opt.sel{border-color:var(--pr)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{border:1px solid var(--bd);border-radius:14px;padding:8px 12px;margin-bottom:8px;background:var(--card)}
summary{cursor:pointer;font-weight:600}
.ex{direction:ltr;text-align:left;background:var(--bg);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:0 8px;border-radius:8px;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
</style>
</head>
<body>
<div class="wrap"><h1 id="title">🃏 فلش‌کارت انگلیسی</h1><div id="v"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let words=[];
try{words=JSON.parse(localStorage.getItem('yw_words')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('yw_words',JSON.stringify(words))}catch(e){}};
let sample=null;
(async()=>{try{if(window.claude&&claude.use){sample=await claude.use('sample')}}catch(e){sample=null}})();
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};

const tabs=[['add','➕','کلمات'],['cards','🃏','فلش‌کارت'],['games','🎮','بازی'],['gram','📘','گرامر']];
let tab='add';
function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function go(t){tab=t;nav();({add:vAdd,cards:vCards,games:vGames,gram:vGram})[t]()}

/* ---------- کلمات ---------- */
let msg='';
function vAdd(){
 $('#v').innerHTML=`<div class="card"><b>کلمه‌هات رو بریز اینجا ✍️</b>
 <p class="mu">هر کلمه یا عبارت توی یه خط (یا با ویرگول جدا کن). ترجمه و مثال خودکار ساخته می‌شه.</p>
 <textarea id="ta" dir="ltr" placeholder="achieve&#10;take off&#10;reluctant"></textarea>
 <div class="row" style="margin-top:8px"><button class="btn" id="tr" onclick="translate()">ترجمه و ساخت کارت ✨</button></div>
 <p class="mu" id="msg">${esc(msg)}</p></div>
 <div class="card"><b>افزودن دستی</b><div class="row" style="margin:8px 0"><input type="text" id="me" dir="ltr" placeholder="English"><input type="text" id="mf" placeholder="معنی فارسی"></div><button class="btn sec" onclick="manual()">افزودن</button></div>
 <div class="card"><b>کلمات من (${words.length})</b><div id="list"></div></div>`;
 list();
}
function list(){
 const el=$('#list');if(!el)return;
 el.innerHTML=words.length?words.map(w=>`<div class="w"><div><span class="en">${esc(w.en)}</span> ${w.pos?`<span class="tag">${esc(w.pos)}</span>`:''}<div class="mu">${esc(w.fa)}</div></div><button class="x" onclick="del('${w.id}')">🗑</button></div>`).join(''):'<p class="mu">هنوز کلمه‌ای نیست. اولین کلمه‌ت رو اضافه کن 🌱</p>';
}
function del(id){words=words.filter(w=>w.id!=id);save();vAdd()}
function mk(o){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),en:o.en,fa:o.fa||'',pos:o.pos||'',ex:o.ex||'',exfa:o.exfa||'',box:0}}
function manual(){
 const e=$('#me').value.trim(),f=$('#mf').value.trim();
 if(!e||!f){msg='هر دو فیلد رو پر کن 🙂';return vAdd()}
 words.unshift(mk({en:e,fa:f}));save();msg='اضافه شد ✅';vAdd();
}
async function translate(){
 const raw=$('#ta').value.split(/[\n,،;]+/).map(s=>s.trim()).filter(Boolean);
 if(!raw.length){$('#msg').textContent='اول چندتا کلمه بنویس 🙂';return}
 const b=$('#tr');b.disabled=true;$('#msg').textContent='در حال ترجمه… ⏳';
 try{
  const r=!sample?await webTr(raw):await sample.json('Translate these English words/phrases into natural Persian. Return ONLY a JSON array, one object per item, in the same order: {"en":the original,"fa":short Persian meaning(s),"pos":part of speech in English abbreviation,"ex":a simple English example sentence,"exfa":Persian translation of the example}. Items: '+JSON.stringify(raw));
  const arr=(Array.isArray(r)?r:[]).filter(o=>o&&o.en&&o.fa);
  arr.reverse().forEach(o=>{if(!words.some(w=>w.en.toLowerCase()==String(o.en).toLowerCase()))words.unshift(mk(o))});
  save();msg=arr.length+' کارت ساخته شد 🎉';vAdd();
 }catch(e){b.disabled=false;$('#msg').textContent='ترجمه انجام نشد 😕 دوباره امتحان کن یا دستی اضافه کن.'}
}

/* ---------- فلش‌کارت ---------- */
let q=[],cur=null,flipped=false;
function vCards(){
 if(!words.length){$('#v').innerHTML='<div class="card">اول از تب «کلمات» چندتا کلمه اضافه کن 🌱</div>';return}
 if(!q.length){q=shuf(words.filter(w=>w.box<3).map(w=>w.id))}
 if(!q.length){const m=words.filter(w=>w.box>=3).length;$('#v').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🏆</div><b>همه‌ی ${m} کلمه رو یاد گرفتی! دمت گرم!</b><p class="mu">برای مرور دوباره، کارت‌ها رو از نو شروع کن.</p><button class="btn" onclick="words.forEach(w=>w.box=0);save();q=[];vCards()">شروع دوباره 🔁</button></div>`;return}
 cur=words.find(w=>w.id==q[0]);flipped=false;
 if(!cur){q.shift();return vCards()}
 const done=words.filter(w=>w.box>=3).length;
 $('#v').innerHTML=`<div class="mu">یاد گرفته‌شده: ${done} از ${words.length}</div><div class="bar"><i style="width:${done/words.length*100}%"></i></div>
 <div class="flip" id="fl" onclick="flipC()"><div class="fi"><div class="face"><div class="big">${esc(cur.en)}</div>${cur.pos?`<span style="opacity:.8">${esc(cur.pos)}</span>`:''}<div style="margin-top:14px;opacity:.8">بزن تا برگرده 👆</div></div>
 <div class="face b"><div style="font-size:26px;font-weight:800">${esc(cur.fa)}</div>${cur.ex?`<div class="ex" style="margin-top:12px">${esc(cur.ex)}<div dir="rtl" class="mu" style="text-align:right">${esc(cur.exfa)}</div></div>`:''}</div></div></div>
 <div class="row"><button class="btn sec" onclick="speak(cur.en)">🔊 تلفظ</button></div>
 <div class="row" style="margin-top:10px"><button class="btn bad" onclick="ans(0)">نمی‌دونستم 🔁</button><button class="btn ok" onclick="ans(1)">بلدم ✅</button></div>`;
}
function flipC(){flipped=!flipped;$('#fl').classList.toggle('f',flipped)}
function ans(k){
 const id=q.shift();
 if(k){cur.box++;if(cur.box<3)q.push(id)}else{cur.box=0;q.splice(Math.min(3,q.length),0,id)}
 save();vCards();
}

/* ---------- بازی‌ها ---------- */
function vGames(){
 const n=words.length;
 $('#v').innerHTML=`<div class="card"><b>یه بازی انتخاب کن 🎮</b><p class="mu">تعداد کلمه‌های تو: ${n}</p></div>
 <div class="g"><button class="opt" onclick="quiz()">🎯<br>آزمون چهارگزینه‌ای</button><button class="opt" onclick="typing()">⌨️<br>تایپ کلمه</button><button class="opt" onclick="match()">🧩<br>جورکردن</button><button class="opt" onclick="speedGame()">⚡<br>درست یا غلط</button></div><div id="gm"></div>`;
}
const need=(k)=>{if(words.length<k){$('#gm').innerHTML=`<div class="card">برای این بازی حداقل ${k} کلمه لازمه 🙂</div>`;return false}return true};
let G={};
function quiz(){
 if(!need(4))return;
 G={list:shuf(words).slice(0,10),i:0,s:0};qq();
}
function qq(){
 if(G.i>=G.list.length)return fin();
 const w=G.list[G.i],dir=Math.random()<.5;
 const others=shuf(words.filter(x=>x.id!=w.id)).slice(0,3);
 const opts=shuf([w,...others]);
 $('#gm').innerHTML=`<div class="card"><div class="mu">سؤال ${G.i+1} از ${G.list.length} · امتیاز ${G.s}</div><div class="bar"><i style="width:${G.i/G.list.length*100}%"></i></div>
 <div class="big" style="text-align:center;margin:10px 0;${dir?'':'direction:rtl'}">${esc(dir?w.en:w.fa)}</div>
 ${opts.map(o=>`<button class="opt ${dir?'':'en'}" style="${dir?'':'direction:ltr;text-align:center'}" data-c="${o.id==w.id?1:0}" onclick="pick(this)">${esc(dir?o.fa:o.en)}</button>`).join('')}</div>`;
}
function pick(b){
 const all=document.querySelectorAll('#gm .opt');
 all.forEach(x=>{x.disabled=true;if(x.dataset.c=='1')x.classList.add('ok')});
 if(b.dataset.c=='1')G.s++;else b.classList.add('bad');
 setTimeout(()=>{G.i++;qq()},900);
}
function fin(){
 const p=Math.round(G.s/G.list.length*100);
 $('#gm').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${p>=80?'🏆':p>=50?'👏':'💪'}</div><b>${G.s} از ${G.list.length}</b><p class="mu">${p>=80?'عالی بود!':p>=50?'خوب بود، یه بار دیگه!':'اشکال نداره، تمرین کن می‌شه!'}</p><button class="btn" onclick="vGames()">بازی دیگه 🎮</button></div>`;
}
function typing(){
 if(!need(1))return;
 G={list:shuf(words).slice(0,8),i:0,s:0};tq();
}
function tq(){
 if(G.i>=G.list.length)return fin();
 const w=G.list[G.i];
 $('#gm').innerHTML=`<div class="card"><div class="mu">${G.i+1} از ${G.list.length} · امتیاز ${G.s}</div><div class="bar"><i style="width:${G.i/G.list.length*100}%"></i></div>
 <div style="font-size:24px;font-weight:800;text-align:center;margin:10px 0">${esc(w.fa)}</div>
 <input type="text" id="ti" dir="ltr" autocomplete="off" autocapitalize="off" placeholder="English…">
 <div class="row" style="margin-top:10px"><button class="btn" id="tb" onclick="tcheck()">بررسی ✔️</button></div><p id="tr2" style="text-align:center"></p></div>`;
 $('#ti').focus();$('#ti').onkeydown=e=>{if(e.key=='Enter')tcheck()};
}
function tcheck(){
 const w=G.list[G.i],v=$('#ti').value.trim().toLowerCase();
 if(!v)return;
 const ok=v==w.en.toLowerCase();if(ok)G.s++;
 $('#tr2').innerHTML=ok?'✅ آفرین!':`❌ جواب درست: <b dir="ltr">${esc(w.en)}</b>`;
 $('#tb').disabled=true;$('#ti').disabled=true;
 setTimeout(()=>{G.i++;tq()},1300);
}
function match(){
 if(!need(3))return;
 const l=shuf(words).slice(0,6);
 G={l,a:shuf(l.map(w=>w.id)),b:shuf(l.map(w=>w.id)),sel:null,done:0,t:0};mr();
}
function mr(){
 $('#gm').innerHTML=`<div class="card"><div class="mu">جفت‌ها رو پیدا کن · تلاش‌ها: ${G.t}</div><div class="g" style="margin-top:8px"><div>${G.a.map(id=>{const w=G.l.find(x=>x.id==id);return`<button class="opt en" style="text-align:center" data-id="${id}" data-s="a" onclick="mpick(this)">${esc(w.en)}</button>`}).join('')}</div><div>${G.b.map(id=>{const w=G.l.find(x=>x.id==id);return`<button class="opt" data-id="${id}" data-s="b" onclick="mpick(this)">${esc(w.fa)}</button>`}).join('')}</div></div></div>`;
}
function mpick(b){
 if(b.classList.contains('ok'))return;
 if(!G.sel||G.sel.dataset.s==b.dataset.s){document.querySelectorAll('#gm .sel').forEach(x=>x.classList.remove('sel'));G.sel=b;b.classList.add('sel');return}
 G.t++;const a=G.sel;G.sel=null;
 if(a.dataset.id==b.dataset.id){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});G.done++;
  if(G.done==G.l.length)setTimeout(()=>{$('#gm').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">🎉</div><b>همه رو جور کردی با ${G.t} تلاش!</b><br><br><button class="btn" onclick="vGames()">بازی دیگه 🎮</button></div>`},500)}
 else{b.classList.add('bad');setTimeout(()=>{b.classList.remove('bad');a.classList.remove('sel')},500)}
}
function speedGame(){
 if(!need(4))return;
 G={list:shuf(words).slice(0,10),i:0,s:0};sq();
}
function sq(){
 if(G.i>=G.list.length)return fin();
 const w=G.list[G.i],t=Math.random()<.5,sh=t?w:shuf(words.filter(x=>x.id!=w.id))[0];
 G.t=t;
 $('#gm').innerHTML=`<div class="card"><div class="mu">${G.i+1} از ${G.list.length} · امتیاز ${G.s}</div><div class="bar"><i style="width:${G.i/G.list.length*100}%"></i></div>
 <div class="big" style="text-align:center">${esc(w.en)}</div><div style="text-align:center;font-size:22px;margin:8px 0">یعنی «${esc(sh.fa)}»؟</div>
 <div class="row"><button class="btn bad" onclick="sans(false)">غلط ❌</button><button class="btn ok" onclick="sans(true)">درست ✅</button></div></div>`;
}
function sans(v){if(v===G.t)G.s++;G.i++;sq()}

/* ---------- گرامر ---------- */
const L=[
['Present Simple — زمان حال ساده','برای عادت‌ها و حقیقت‌ها. فاعل سوم‌شخص مفرد (he/she/it) → s می‌گیره.',['I study every night.','She works in Kashan.','Water boils at 100°C.'],'فرمول: Subject + V1 (+s)'],
['Present Continuous — حال استمراری','برای کاری که همین الان در حال انجامه.',['I am drawing now.','They are playing.'],'فرمول: am/is/are + V-ing'],
['Past Simple — گذشته ساده','برای کاری که در گذشته تموم شده. افعال باقاعده ed می‌گیرن، بی‌قاعده شکل خاص دارن.',['I visited Isfahan last year.','He went home.'],'فرمول: V2 / did + not + V1'],
['Present Perfect — حال کامل','برای تجربه یا کاری که اثرش تا حالا مونده.',['I have seen this film.','She has lost her key.'],'فرمول: have/has + V3'],
['Future — آینده','will برای تصمیم لحظه‌ای و پیش‌بینی، going to برای برنامه‌ی قبلی.',['I will help you.','We are going to travel.'],'فرمول: will + V1 / am-is-are going to + V1'],
['Modals — افعال کمکی','can (توانایی)، should (توصیه)، must (اجبار)، may (اجازه). بعدشون همیشه V1 میاد.',['You should rest.','She can swim.'],'فرمول: modal + V1 (بدون to)'],
['Articles — حروف تعریف','a قبل از صدای بی‌صدا، an قبل از صدای باصدا، the برای چیز مشخص.',['a book, an apple','The sun is hot.'],'یادآوری: ملاک «صدا»ست نه «حرف»: an hour'],
['Comparatives — صفت تفضیلی','صفت کوتاه + er، صفت بلند با more.',['taller than me','more interesting than that'],'فرمول: adj+er / more adj + than']
];
function vGram(){
 $('#v').innerHTML=`<div class="card"><b>تمرین گرامر با کلمات خودت 🧠</b><p class="mu">از کلمه‌های ذخیره‌شده‌ات جمله‌ی جای‌خالی می‌سازه.</p><button class="btn" id="gb" onclick="gex()">بساز ✨</button><div id="ge"></div></div>
 <b>درس‌های کوتاه 📘</b><div style="margin-top:8px">${L.map(l=>`<details><summary>${l[0]}</summary><p>${l[1]}</p>${l[2].map(e=>`<div class="ex">${esc(e)}</div>`).join('')}<p class="mu">💡 ${l[3]}</p></details>`).join('')}</div>`;
}
async function gex(){
 if(!sample){G.ex=shuf(BANK).slice(0,5);return showEx()}
 const ws=shuf(words).slice(0,8).map(w=>w.en);
 $('#gb').disabled=true;$('#ge').innerHTML='<p class="mu">در حال ساخت… ⏳</p>';
 try{
  const r=await sample.json('Create 5 English grammar multiple-choice exercises for a Persian-speaking learner (A2-B1). '+(ws.length?'Where natural, use these words: '+ws.join(', ')+'. ':'')+'Return ONLY a JSON array of {"s":sentence with ____ as blank,"o":[4 options],"a":index of correct option (0-3),"fa":short Persian explanation}.');
  G.ex=(Array.isArray(r)?r:[]).filter(x=>x&&x.s&&Array.isArray(x.o)&&x.o.length>1);
  $('#gb').disabled=false;showEx();
  return;
  $('#ge').innerHTML=G.ex.map((x,i)=>`<div style="margin-top:12px"><div class="ex">${i+1}. ${esc(x.s)}</div>${x.o.map((o,j)=>`<button class="opt" style="direction:ltr" data-i="${i}" data-j="${j}" onclick="gpick(this)">${esc(o)}</button>`).join('')}<div class="mu" id="gx${i}"></div></div>`).join('')||'<p class="mu">چیزی ساخته نشد، دوباره امتحان کن.</p>';
 }catch(e){$('#gb').disabled=false;$('#ge').innerHTML='<p class="mu">ساخته نشد 😕 دوباره امتحان کن.</p>'}
}
function gpick(b){
 const i=+b.dataset.i,x=G.ex[i];
 document.querySelectorAll(`[data-i="${i}"]`).forEach(o=>{o.disabled=true;if(+o.dataset.j==x.a)o.classList.add('ok')});
 if(+b.dataset.j!=x.a)b.classList.add('bad');
 $('#gx'+i).textContent=x.fa||'';
}

/* ---------- ترجمه‌ی آنلاین (نسخه‌ی مستقل) ---------- */
async function webTr(raw){
 const out=[];
 for(const en of raw){
  const o={en,fa:'',pos:'',ex:'',exfa:''};
  try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(en)+'&langpair=en|fa');const j=await r.json();o.fa=(j.responseData&&j.responseData.translatedText)||''}catch(e){}
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(en));const j=await r.json();for(const m of j[0].meanings){if(!o.pos)o.pos=m.partOfSpeech||'';for(const d of m.definitions)if(d.example&&!o.ex)o.ex=d.example}}catch(e){}
  if(o.fa)out.push(o);
 }
 return out;
}
